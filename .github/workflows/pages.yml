name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MIT client modules
        uses: actions/checkout@v4
        with:
          repository: evshiron/parsec-web-client
          ref: ddfaeb64c0a54f5ef86ea41a753ad15360a8535c
          path: vendor-src
          persist-credentials: false
      - name: Validate JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const script = html.split('<script>')[1].split('</script>')[0];
          new Function(script);
          console.log('JavaScript syntax OK');
          NODE
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
      - name: Build and check experimental client
        run: python3 scripts/build-client.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
